<div class="playground-layout">
  <app-header
    [agents]="agents()"
    [personas]="personas()"
    [selectedAgentId]="selectedAgentId()"
    [selectedPersona]="selectedPersona()"
    [isDbDrawerOpen]="isDbDrawerOpen()"
    [isGuideDrawerOpen]="isGuideDrawerOpen()"
    [isSimulatorOpen]="simulator.isOpen()"
    [health]="health()"
    (selectAgent)="onSelectAgent($event)"
    (selectPersona)="onSelectPersona($event)"
    (toggleDbDrawer)="toggleDbDrawer()"
    (toggleGuideDrawer)="toggleGuideDrawer()"
    (startWalkthrough)="startWalkthrough()"
    (toggleSimulator)="toggleSimulator()"
  ></app-header>

  <!-- Navegación móvil segmentada (360px - 767px) -->
  <nav class="mobile-tabs-toggle" aria-label="Navegación de paneles para dispositivos móviles">
    <button 
      type="button"
      class="mobile-tab-btn" 
      [class.active]="activeMobileTab() === 'chat'"
      (click)="activeMobileTab.set('chat')"
      aria-label="Ver panel de conversación"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      <span>Conversación</span>
    </button>
    <button 
      type="button"
      class="mobile-tab-btn" 
      [class.active]="activeMobileTab() === 'inspector'"
      (click)="activeMobileTab.set('inspector')"
      aria-label="Ver panel de inspector de ejecución"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span>Ejecución</span>
    </button>
    @if (selectedAgentId() === 'v3') {
      <button 
        type="button"
        class="mobile-tab-btn" 
        [class.active]="activeMobileTab() === 'memory'"
        (click)="activeMobileTab.set('memory')"
        aria-label="Ver panel de estado y memoria"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
          <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
        </svg>
        <span>Memoria</span>
      </button>
    }
  </nav>

  <!-- Barra de alternancia secundaria en tableta (768px - 1199px) para Agent v3 -->
  @if (selectedAgentId() === 'v3') {
    <nav class="tablet-v3-subnav" aria-label="Selector de panel secundario en tableta">
      <span class="tablet-subnav-label">Vista secundaria:</span>
      <div class="tablet-subnav-group">
        <button
          type="button"
          class="tablet-subnav-btn"
          [class.active]="activeTabletRightTab() === 'inspector'"
          (click)="activeTabletRightTab.set('inspector')"
          aria-label="Mostrar inspector de ejecución"
        >
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span>Inspector de ejecución</span>
        </button>
        <button
          type="button"
          class="tablet-subnav-btn"
          [class.active]="activeTabletRightTab() === 'memory'"
          (click)="activeTabletRightTab.set('memory')"
          aria-label="Mostrar estado y memoria"
        >
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
          </svg>
          <span>Estado y memoria</span>
        </button>
      </div>
    </nav>
  }

  <!-- Cuadrícula principal de observabilidad (Grid responsivo) -->
  <main 
    class="playground-main"
    [class.mode-v3]="selectedAgentId() === 'v3'"
    [class.mode-v1-v2]="selectedAgentId() !== 'v3'"
  >
    <!-- Columna 1: Conversación -->
    <section 
      class="main-pane chat-pane"
      [class.mobile-hidden]="activeMobileTab() !== 'chat'"
      data-purpose="chat-column"
    >
      <app-chat-panel
        [messages]="messages()"
        [isStreaming]="isStreaming()"
        [activeStep]="controller.activeStep()"
        (sendMessage)="onSendMessage($event)"
        (stopStream)="onStopStream()"
      ></app-chat-panel>
    </section>

    <!-- Columna 2: Inspector de Ejecución -->
    <section 
      class="main-pane inspector-pane"
      [class.mobile-hidden]="activeMobileTab() !== 'inspector'"
      [class.tablet-hidden]="selectedAgentId() === 'v3' && activeTabletRightTab() !== 'inspector'"
      data-purpose="runtime-inspector"
    >
      <app-runtime-inspector
        [events]="currentRunEvents()"
        [activeAgentId]="selectedAgentId()"
        [embeddedMemory]="false"
        (selectTaskOption)="onSelectTaskOption($event)"
      ></app-runtime-inspector>
    </section>

    <!-- Columna 3: Estado y Memoria (exclusivo para Agent v3) -->
    @if (selectedAgentId() === 'v3') {
      <section 
        class="main-pane memory-pane"
        [class.mobile-hidden]="activeMobileTab() !== 'memory'"
        [class.tablet-hidden]="activeTabletRightTab() !== 'memory'"
        data-purpose="state-memory-inspector"
        data-tour="tour-memory-panel"
      >
        <app-v3-memory-inspector
          [state]="eventStore.v3State()"
          [showHitlControls]="false"
          (selectTaskOption)="onSelectTaskOption($event)"
        ></app-v3-memory-inspector>
      </section>
    }
  </main>

  @if (isDbDrawerOpen()) {
    <app-tickets-drawer
      [tickets]="tickets()"
      (close)="toggleDbDrawer()"
      (refresh)="refreshTickets()"
    ></app-tickets-drawer>
  }

  @if (isGuideDrawerOpen()) {
    <app-learner-guide-drawer
      [selectedAgentId]="selectedAgentId()"
      (close)="toggleGuideDrawer()"
      (selectAgent)="onSelectAgent($event)"
    ></app-learner-guide-drawer>
  }

  <!-- Modal del Simulador 3D del Runtime -->
  <app-runtime-simulator-modal
    (openFullGuide)="toggleGuideDrawer()"
  ></app-runtime-simulator-modal>

  <!-- Walkthrough Interactivo Flotante -->
  <app-walkthrough-overlay></app-walkthrough-overlay>
</div>
