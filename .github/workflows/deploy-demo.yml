name: Deploy Static Demo to GitHub Pages

on:
  # Despliegue manual seguro mediante workflow_dispatch
  workflow_dispatch:
  # Opcional: Despliegue en push a main solo cuando el usuario lo active
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'scripts/sync_docs.py'
      - 'docs/**'
      - '.github/workflows/deploy-demo.yml'

# Permisos requeridos para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite una sola ejecución concurrente de despliegue
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Build & Validate Static Demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python for Docs Sync
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js (LTS v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (reproducible)
        working-directory: frontend
        run: npm ci

      - name: Synchronize Markdown Guides
        run: python scripts/sync_docs.py

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: npm test

      - name: Build Angular Demo (Static Artifacts)
        working-directory: frontend
        run: npm run build:demo

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Solo se publican los archivos estáticos compilados en browser/
          path: frontend/dist/frontend/browser

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
